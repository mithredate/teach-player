<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>teach-player</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1e1e1e;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      #picker-bar {
        flex: none;
        display: flex;
        background: #252526;
        border-bottom: 1px solid #333;
      }
      #picker {
        flex: 1;
        padding: 4px;
        background: #252526;
        color: #ccc;
        border: none;
      }
      #send-selection {
        flex: none;
        padding: 4px 8px;
        background: #252526;
        color: #ccc;
        border: none;
        border-left: 1px solid #333;
        cursor: pointer;
      }
      #content {
        flex: 1;
        width: 100%;
        border: none;
        background: #fff;
      }
    </style>
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <div id="picker-bar">
      <select id="picker"></select>
      <button id="send-selection">Send selection</button>
    </div>
    <iframe id="content" sandbox="allow-scripts"></iframe>
  </body>
</html>
